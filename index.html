<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل المنتجات - أداة بسيطة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; background: #0f172a; color: #4ade80; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 15px; }
        button { background: #0284c7; color: white; border: none; padding: 15px 30px; border-radius: 25px; cursor: pointer; margin: 5px; font-size: 18px; }
        .log { background: #0f172a; padding: 15px; border-radius: 10px; max-height: 500px; overflow-y: auto; font-size: 13px; margin-top: 15px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔄 نقل المنتجات إلى Supabase</h2>
    <button id="startBtn">🚀 بدء النقل</button>
    <button id="clearBtn" style="background:#e63946;">🗑️ مسح البيانات</button>
    <div id="log" class="log">📋 جاهز... اضغط "بدء النقل"</div>
</div>

<script>
    // ثوابت
    const SUPABASE_URL = "https://ymfxhrbjqubgpgxzhoqx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltZnhocmJqcXViZ3BneHpob3F4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTk1NzQzOSwiZXhwIjoyMDk1NTMzNDM5fQ.VT0B4YeoWiZIY-_DLTlaYcz3Dn2Rrmqc6N1VVD-w18E";
    const API_TOKEN = "t1JI0lA";
    const API_BASE_URL = "https://rolemall.com/api";
    
    let supabase;
    let logDiv = document.getElementById('log');
    
    function log(msg, isError = false) {
        const div = document.createElement('div');
        div.style.color = isError ? '#f87171' : '#4ade80';
        div.innerHTML = isError ? '🔴 ' + msg : '🟢 ' + msg;
        logDiv.appendChild(div);
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(msg);
    }
    
    // ربط الأزرار
    document.getElementById('startBtn').onclick = function() {
        startTransfer();
    };
    document.getElementById('clearBtn').onclick = function() {
        clearData();
    };
    
    async function startTransfer() {
        log("🚀 بدء النقل...");
        
        try {
            // 1. الاتصال بـ Supabase
            log("📡 الاتصال بـ Supabase...");
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            log("✅ تم الاتصال");
            
            // 2. جلب الأقسام
            log("📡 جلب الأقسام من API...");
            const catRes = await fetch(API_BASE_URL + '/categories/');
            const catData = await catRes.json();
            log("✅ تم جلب الأقسام: " + (catData.data?.categories?.length || 0));
            
            // 3. جلب المنتجات (أول 20 منتج للاختبار)
            log("📡 جلب المنتجات من API...");
            const prodRes = await fetch(API_BASE_URL + '/products/?token=' + API_TOKEN + '&page=1&limit=20');
            const prodData = await prodRes.json();
            const products = prodData.data?.products || [];
            log("✅ تم جلب " + products.length + " منتج");
            
            // 4. إضافة إلى Supabase
            log("📡 إضافة المنتجات إلى Supabase...");
            for (let i = 0; i < products.length; i++) {
                const p = products[i];
                const { error } = await supabase.from('products').upsert([{
                    id: p._id,
                    name: p.name,
                    price: p.price || 0,
                    image: p.img || null,
                    category_id: p.category_id || null
                }]);
                if (error) log("❌ خطأ: " + error.message, true);
            }
            
            log("🎉 اكتمل! تم نقل " + products.length + " منتج");
            
        } catch(e) {
            log("❌ خطأ: " + e.message, true);
        }
    }
    
    async function clearData() {
        if (!confirm("مسح البيانات؟")) return;
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        await supabase.from('products').delete().neq('id', 0);
        await supabase.from('categories').delete().neq('id', 0);
        log("✅ تم مسح البيانات");
    }
    
    log("✅ الأداة جاهزة");
</script>
</body>
</html>
