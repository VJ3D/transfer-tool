<!DOCTYPE html>
<html>
<head>
    <title>اختبار الزر</title>
    <style>
        body { font-family: Arial; padding: 20px; background: black; color: white; }
        button { padding: 20px 40px; font-size: 20px; background: blue; color: white; border: none; border-radius: 10px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: #333; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>اختبار زر النقل</h1>
    <button id="myButton">اضغط هنا</button>
    <div id="result">سيظهر هنا نص عند الضغط على الزر</div>

    <script>
        // أبسط طريقة لربط الزر
        document.getElementById('myButton').onclick = function() {
            document.getElementById('result').innerHTML = "✅ الزر يعمل! تم الضغط عليه في " + new Date().toLocaleTimeString();
        };
        
        // رسالة تأكيد أن الصفحة تحملت
        document.getElementById('result').innerHTML = "✅ الصفحة جاهزة. اضغط على الزر.";
    </script>
</body>
</html>
