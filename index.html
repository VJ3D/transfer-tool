<!DOCTYPE html>
<html>
<head>
    <title>تشخيص المشكلة</title>
</head>
<body>
    <h1>تشخيص مشكلة الزر</h1>
    <button onclick="testFunction()">اضغط هنا للاختبار</button>
    <div id="result"></div>

    <script>
        function testFunction() {
            document.getElementById('result').innerHTML = '✅ الزر يعمل! التاريخ: ' + new Date();
            console.log("تم الضغط على الزر بنجاح");
        }
        
        document.getElementById('result').innerHTML = '✅ الصفحة جاهزة. اضغط على الزر.';
        console.log("الصفحة تحمّلت بنجاح");
    </script>
</body>
</html>
